<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BACCARAT VIP MASTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">BACCARAT VIP</div>
            <div class="game">LIVE TABLE SHOWDOWN</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🐉 [PLAYER বনাম BANKER লাইভ ৩ডি কার্ড ডিলিং জোন] -->
    <div class="game-battle-zone">
        <!-- প্লেয়ার সাইড (নীল লাক্সারি বর্ম) -->
        <div class="side-panel player-zone">
            <div class="side-title">PLAYER</div>
            <div class="cards-row">
                <div class="playing-card" id="player-card-1">🎴</div>
                <div class="playing-card" id="player-card-2">🎴</div>
                <div class="playing-card third-card-slot" id="player-card-3">🎴</div>
            </div>
            <div class="score-badge" id="player-score-lbl">POINTS: 0</div>
        </div>

        <!-- ব্যাংকার সাইড (লাল লাক্সারি বর্ম) -->
        <div class="side-panel banker-zone">
            <div class="side-title">BANKER</div>
            <div class="cards-row">
                <div class="playing-card" id="banker-card-1">🎴</div>
                <div class="playing-card" id="banker-card-2">🎴</div>
                <div class="playing-card third-card-slot" id="banker-card-3">🎴</div>
            </div>
            <div class="score-badge" id="banker-score-lbl">POINTS: 0</div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন বাজি ধরার ৩টি প্রধান বোর্ড ঘর ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn play-bet" id="board-player" onclick="selectBetSide('PLAYER')">
            <span class="board-label">PLAYER</span>
            <span class="board-odds">x2.00</span>
        </button>
        
        <button class="bet-board-btn tie-bet" id="board-tie" onclick="selectBetSide('TIE')">
            <span class="board-label">TIE</span>
            <span class="board-odds">x9.00</span>
        </button>
        
        <button class="bet-board-btn bank-bet" id="board-banker" onclick="selectBetSide('BANKER')">
            <span class="board-label">BANKER</span>
            <span class="board-odds">x1.95</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">যেকোনো এক পক্ষে বাজি ধরে DEAL বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও DEAL বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleBaccaratDeal()">DEAL</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let selectedOption = null; // PLAYER, BANKER, TIE
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/baccarat-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
        };

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedOption = side;
            
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            if (side === 'PLAYER') document.getElementById("board-player").classList.add("active-side-bet");
            if (side === 'TIE') document.getElementById("board-tie").classList.add("active-side-bet");
            if (side === 'BANKER') document.getElementById("board-banker").classList.add("active-side-bet");
            
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

                function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleBaccaratDeal();
            playAudio('click');
        }

        async function handleBaccaratDeal() {
            if (isSpinning) return;
            if (!selectedOption) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি পক্ষ (PLAYER, BANKER বা TIE) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            const pc1 = document.getElementById("player-card-1");
            const pc2 = document.getElementById("player-card-2");
            const pc3 = document.getElementById("player-card-3");
            const bc1 = document.getElementById("banker-card-1");
            const bc2 = document.getElementById("banker-card-2");
            const bc3 = document.getElementById("banker-card-3");
            const msgBox = document.getElementById("win-status-box");
            
            msgBox.className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🃏 ডিলার কার্ড বন্টন করছে...";
            document.getElementById("player-score-lbl").innerText = "POINTS: 0";
            document.getElementById("banker-score-lbl").innerText = "POINTS: 0";

            // সব কার্ড ক্যাসিনো রি-রিসেট লক ভাই ভাই
            const allCards = [pc1, pc2, pc3, bc1, bc2, bc3];
            allCards.forEach(c => {
                c.className = "playing-card card-dealing";
                c.innerText = "🎴";
                c.style.color = "#000000";
                c.style.display = "flex";
            });
            pc3.style.display = "none";
            bc3.style.display = "none";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            // 🚀 কার্ড শাফল ও ওড়ার কড়া সাউন্ড spin2.mp3 ফায়ার লক ভাই!
            playAudio('spin');

            try {
                const response = await fetch(`${SERVER_URL}/api/baccarat-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedOption
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ৩ সেকেন্ডের ৩ডি কার্ড ডিলিং থ্রিল লুপ শেষে রেজাল্ট ম্যাপিং ভাই
                    setTimeout(() => {
                        // ১. প্লেয়ার ১ম ও ২য় কার্ড ওপেন ভাই ভাই
                        pc1.className = "playing-card"; pc1.innerText = `${data.playerHand[0].value}${data.playerHand[0].suit}`;
                        if (data.playerHand[0].suit === "♥️" || data.playerHand[0].suit === "♦️") pc1.style.color = "#ea2027";
                        
                        pc2.className = "playing-card"; pc2.innerText = `${data.playerHand[1].value}${data.playerHand[1].suit}`;
                        if (data.playerHand[1].suit === "♥️" || data.playerHand[1].suit === "♦️") pc2.style.color = "#ea2027";

                        // ২. ব্যাংকার ১ম ও ২য় কার্ড ওপেন ভাই ভাই
                        bc1.className = "playing-card"; bc1.innerText = `${data.bankerHand[0].value}${data.bankerHand[0].suit}`;
                        if (data.bankerHand[0].suit === "♥️" || data.bankerHand[0].suit === "♦️") bc1.style.color = "#ea2027";
                        
                        bc2.className = "playing-card"; bc2.innerText = `${data.bankerHand[1].value}${data.bankerHand[1].suit}`;
                        if (data.bankerHand[1].suit === "♥️" || data.bankerHand[1].suit === "♦️") bc2.style.color = "#ea2027";

                        // ৩. ৩ নম্বর থার্ড কার্ড রুলস মেকানিজম চেক লক ভাই ভাই
                        if (data.playerHand.length === 3) {
                            pc3.style.display = "flex";
                            pc3.className = "playing-card"; pc3.innerText = `${data.playerHand[2].value}${data.playerHand[2].suit}`;
                            if (data.playerHand[2].suit === "♥️" || data.playerHand[2].suit === "♦️") pc3.style.color = "#ea2027";
                        }
                        if (data.bankerHand.length === 3) {
                            bc3.style.display = "flex";
                            bc3.className = "playing-card"; bc3.innerText = `${data.bankerHand[2].value}${data.bankerHand[2].suit}`;
                            if (data.bankerHand[2].suit === "♥️" || data.bankerHand[2].suit === "♦️") bc3.style.color = "#ea2027";
                        }

                        document.getElementById("player-score-lbl").innerText = `POINTS: ${data.playerScore}`;
                        document.getElementById("banker-score-lbl").innerText = `POINTS: ${data.bankerScore}`;

                        showFinalResult(data.status, data.winAmount, data.winnerSide);
                    }, 3000);

                } else {
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopDealState();
                }
            } catch (err) {
                alert("⚠️ সেশন আউট! আবার DEAL বোতাম চাপুন ভাই ভাই।");
                stopDealState();
            }
        }

        function showFinalResult(status, winAmount, winnerSide) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            const sideNameBengali = (winnerSide === "PLAYER") ? "PLAYER 👤" : (winnerSide === "BANKER") ? "BANKER 👑" : "🤝 TIE (ড্র)";

            if (status === "win") {
                // 🎵 বাজি জিতলে টাকা মেইন ওয়ালেটে ডবল হওয়ামাত্রই win2.mp3 রাজকীয় সাউন্ড ফায়ার লক ভাই!
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! বিজয়ী পক্ষ: ${sideNameBengali} (৳${winAmount})`;
            } else if (status === "push") {
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                msgBox.style.background = "#e67e22";
                textMsg.innerText = `🤝 ড্র (TIE) হয়েছে! আপনার বাজি রিফান্ড করা হয়েছে (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ বিজয়ী পক্ষ: ${sideNameBengali}। এই রাউন্ডে ভাগ্য সহায় হয়নি ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopDealState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleBaccaratDeal();
                }, 2000);
            }
        }

        function stopDealState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [আপনার রিকোয়ারমেন্ট অনুযায়ী ৩টি প্রিমিয়াম সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; // 🔇 সাউন্ড অফ থাকলে কোনো অডিও প্লে হবে না ভাই ভাই!
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
